async function cloudRequest(path,options={}){const r=await fetch(CLOUD_BASE+'/'+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(!r.ok)throw new Error('cloud '+r.status);return r.json().catch(()=>({}))}

function imgHtml(p,cls=''){return `${p.img?`<img class="${cls}" src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:''}<span class="placeholder" style="display:${p.img?'none':'grid'}">${icons[p.cat]||'🛍️'}</span>`}
function competitionEndTime(p){
  if(!p||!p.competition)return 0;
  const isDemo=!!p.isDemo&&p.scenarioId===demoScenarioId;
  if(isDemo){
    const started=Number(p.competitionStartedAt)||0;
    if(!started)return 0;
    return started+Math.max(1,Number(p.configuredDurationMinutes)||60)*60000;
  }
  return Number(p.end)||0;
}
function competitionState(p){
  if(!p.competition)return {active:false,started:false,remaining:0};
  const isDemo=!!p.isDemo&&p.scenarioId===demoScenarioId;
  const started=isDemo?Number(p.competitionStartedAt)||0:true;
  if(isDemo&&!started)return {active:true,started:false,remaining:Math.max(1,Number(p.configuredDurationMinutes)||60)*60000};
  const end=competitionEndTime(p);
  return {active:end>Date.now(),started:true,remaining:Math.max(0,end-Date.now())};
}
function competitionActive(p){return competitionState(p).active}
function productCard(p){const st=competitionState(p),active=st.active,ended=!!p.competition&&competitionEnded(p);const used=attempts[p.id]||0;const timerText=st.started?`<span data-end="${competitionEndTime(p)}">...</span>`:`<span>زمان مسابقه: ${Math.max(1,Number(p.configuredDurationMinutes)||5)} دقیقه</span>`;return `<article class="card"><div class="productimg">${imgHtml(p)}</div><div class="cardbody"><div class="row"><span class="tag">${esc(catName(p.cat))}</span>${p.competition?`<span class="${active?'discount':'timer'}">${active?`${p.discount}% تخفیف`:'مسابقه پایان یافته'}</span>`:''}</div><div class="title">${esc(p.name)}</div><div class="muted">${esc(p.brand||'')}</div><div style="margin-top:8px"><span class="price">${money(p.price)}</span></div>${active?`<div class="row" style="margin-top:10px"><span class="timer">⏱ ${timerText}</span><span class="muted">${Math.max(0,p.freeAttempts-used)} فرصت رایگان</span></div>`:ended?`<div class="muted" style="margin-top:10px">⏰ مسابقه تمام شده • نتایج قابل مشاهده است</div>`:`<div class="muted" style="margin-top:10px">فروش عادی • موجودی: ${p.stock}</div>`}<div class="cardactions"><button class="secondary" onclick="openProduct(${p.id})">جزئیات</button>${active?`<button class="primary" onclick="startGame(${p.id})">🎮 بازی کن</button>`:ended?`<button class="primary" onclick="showCompetitionResults(${p.id})">🏆 نتایج</button>`:`<button class="primary" onclick="addCart(${p.id})">افزودن به سبد</button>`}</div></div></article>`}

function renderHome(a){const active=products.filter(p=>competitionActive(p)).slice(0,3);const upcoming=products.filter(p=>!p.competition).slice(0,3);a.innerHTML=`<section class="hero"><div class="hero-content"><span class="eyebrow">نسل جدید خرید هوشمند</span><h1>بازی کن، رقابت کن،<br>با تخفیف بخر.</h1><p>محصول مورد علاقه‌ات را انتخاب کن، وارد مسابقه شو و با بهترین امتیاز، شانس خرید آن را با تخفیف ویژه به دست بیاور.</p><div class="hero-actions"><button class="primary" onclick="go('competitions')">مشاهده مسابقات</button><button class="secondary" onclick="go('shop')">مشاهده فروشگاه</button></div></div></section><section class="section"><div class="sectionhead"><div><h2>🔥 مسابقات در حال برگزاری</h2><span class="muted">برای هر محصول، یک رقابت مستقل</span></div><button class="secondary" onclick="go('competitions')">همه مسابقات ←</button></div><div class="cards">${active.map(productCard).join('')}</div></section><section class="section"><div class="sectionhead"><h2>دسته‌بندی‌ها</h2><button class="secondary" onclick="go('shop')">فروشگاه</button></div><div class="category-grid">${categories.map(c=>`<div class="cat" onclick="selectedCat='${c.id}';go('shop')"><div class="emoji">${esc(c.icon||'🛍️')}</div><b>${esc(c.name)}</b></div>`).join('')}</div></section><section class="section"><div class="sectionhead"><div><h2>🏁 مسابقات پایان‌یافته</h2><span class="muted">نتایج مسابقات حتی پس از پایان قابل مشاهده است</span></div></div><div class="cards">${products.filter(p=>p.competition&&competitionEnded(p)).slice(0,3).map(productCard).join('')||'<div class="card" style="padding:25px;text-align:center;grid-column:1/-1">هنوز مسابقه‌ای پایان نیافته است.</div>'}</div></section><section class="section"><div class="sectionhead"><div><h2>⏳ محصولات بدون مسابقه</h2><span class="muted">خرید عادی با قیمت کامل</span></div></div><div class="coming">${upcoming.map(p=>`<div class="card"><div class="thumb">${imgHtml(p)}</div><div><b>${esc(p.name)}</b><div class="muted">${esc(catName(p.cat))}</div><span class="tag">فروش عادی</span></div></div>`).join('')}</div></section>`}

async function startGame(id){
  const p=products.find(x=>x.id===id);
  if(!p||!p.competition){showToast('این مسابقه فعال نیست.');return}
  const now=Date.now();
  const isDemo=!!p.isDemo&&p.scenarioId===demoScenarioId;
  if(isDemo&&!Number(p.competitionStartedAt)){
    window.__activeGameProductId=p.id;
    const mins=Math.max(1,Number(p.configuredDurationMinutes)||60);
    p.competitionStartedAt=now;
    p.end=now+mins*60000;
    saveLocal();
    try{await syncCloud()}catch(e){}
  }else if(isDemo&&Number(p.competitionStartedAt)){
    window.__activeGameProductId=p.id;
    const expectedEnd=Number(p.competitionStartedAt)+Math.max(1,Number(p.configuredDurationMinutes)||60)*60000;
    if(Number(p.end)!==expectedEnd){
      p.end=expectedEnd;
      saveLocal();
      try{await syncCloud()}catch(e){}
    }
  }
  if(!isDemo&&competitionEndTime(p)<=now){showToast('این مسابقه فعال نیست.');return}
  if(isDemo&&(!Number(p.competitionStartedAt)||competitionEndTime(p)<=Date.now())){showToast('این مسابقه فعال نیست.');return}
  window.__activeGameProductId=p.id;
  const used=attempts[id]||0;
  const max=Number(p.freeAttempts)||0;
  if(used>=max){openModal(`<div class="modalhead"><h2>فرصت‌های رایگان</h2><button class="close" onclick="closeModal()">×</button></div><div class="winner"><div style="font-size:45px">🎟️</div><h3>فرصت رایگان این محصول تمام شده است.</h3><p>این مقدار از پنل مدیریت قابل تغییر است.</p><button class="primary" onclick="closeModal();go('admin')">رفتن به مدیریت</button></div>`);return}

function makeCode(p){const prefix=String(p.name).replace(/[^A-Za-z0-9]/g,'').slice(0,4).toUpperCase()||'BIEN';return `BIEN-${prefix}-${Math.random().toString(36).slice(2,7).toUpperCase()}`}
function issueReward(id,score){const p=products.find(x=>x.id===id);if(!p)return null;const top=topOpponent(p);if(Number(score)>top){const old=rewards[id];const r={id:'rw_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),productId:id,productName:p.name,game:gameName(p.game),score:Number(score),discount:Number(p.discount)||0,code:makeCode(p),issuedAt:Date.now(),expiresAt:Date.now()+7*86400000,used:false};rewards[id]=r;saveLocal();syncCloud();return r}return null}
function competitionEnded(p){if(!p.competition)return true;const st=competitionState(p);return st.started&&!st.active;}
function finishGame(id,score,elapsed){attempts[id]=(attempts[id]||0)+1;scores[id]=Math.max(scores[id]||0,score);save();syncCloud();closeModal();showResult(id,score,elapsed);setTimeout(checkCompetitionEnds,50)}
function showResult(id,score){const p=products.find(x=>x.id===id),used=attempts[id]||0,max=p.freeAttempts||0,top=topOpponent(p),ended=competitionEnded(p),isFirst=score>top;let reward=ended&&isFirst?issueReward(id,score):rewards[id];const ranks=[...competitorList(p),{name:user.username||'شما',score:score,me:true}].sort((a,b)=>b.score-a.score);const myRank=ranks.findIndex(x=>x.me)+1;openModal(`<div class="modalhead"><h2>🎉 نتیجه بازی</h2><button class="close" onclick="closeModal()">×</button></div><div class="winner"><div class="scorebig">${score.toLocaleString('fa-IR')}</div><div>امتیاز این دور</div><hr><p>رتبه فعلی شما: <b>${myRank}</b></p><p>نفر اول فعلی: <b>${isFirst?'شما':esc(ranks[0]?.name||'رقیب')}</b></p>${ended&&isFirst&&reward?`<div class="reward-pop"><div style="font-size:46px">🏆</div><h2>🎊 برنده شدی!</h2><p>مسابقه به پایان رسیده و بالاترین امتیاز برای تو ثبت شده است.</p><div class="code">${reward.code}</div><p><b>${reward.discount}% تخفیف</b> برای ${esc(reward.productName)}</p><small>این کد در بخش «جوایز من» هم ذخیره شده است.</small><button class="primary" style="width:100%;margin-top:12px" onclick="addRewardToCart('${reward?.id||''}');closeModal();go('cart')">🛒 خرید همین محصول با ${reward?.discount||0}% تخفیف</button></div>`:ended?`<div class="card" style="padding:12px;background:#fff7ed;border:1px solid #fed7aa"><b>⏰ مسابقه تمام شد.</b><p class="muted">برنده نمایشی این مسابقه ${esc(ranks[0]?.name||'رقیب')} با امتیاز ${Number(ranks[0]?.score||0).toLocaleString('fa-IR')} است.</p></div>`:isFirst?`<div class="card" style="padding:12px;background:#ecfdf3;border:1px solid #bbf7d0"><b>🔥 الان نفر اول هستی!</b><p class="muted">اگر تا پایان زمان مسابقه همین رتبه را حفظ کنی، کد تخفیف برای تو صادر می‌شود.</p></div>`:`<div class="card" style="padding:12px;background:#fff7ed;border:1px solid #fed7aa"><b>رقابت ادامه دارد.</b><p class="muted">برای نفر اول شدن ${Math.max(1,top-score+1).toLocaleString('fa-IR')} امتیاز دیگر لازم داری.</p></div>`}${!ended?`<div class="card" style="padding:10px;background:#eff6ff;border:1px solid #bfdbfe">⏱ این دور بازی تمام شد؛ <b>مسابقه محصول هنوز ادامه دارد</b> و می‌توانی دوباره بازی کنی.</div>`:''}<p>فرصت رایگان باقی‌مانده: <b>${Math.max(0,max-used)}</b></p></div><div style="margin-top:15px"><h3>🏆 جدول امتیازها</h3>${ranks.map((r,i)=>`<div class="rank ${r.me?'me':''}"><span class="ranknum">${i+1}</span><b>${esc(r.name)}</b><span style="margin-right:auto">${Number(r.score).toLocaleString('fa-IR')}</span></div>`).join('')}</div><div class="cardactions"><button class="secondary" onclick="closeModal()">ادامه</button>${used<max&&!ended?`<button class="primary" onclick="closeModal();startGame(${id})">بازی دوباره</button>`:''}</div>`)}
function checkCompetitionEnds(){if(!cloudReady)return;products.forEach(p=>{if(!p.competition||!Number(p.competitionStartedAt)||competitionEndTime(p)>Date.now())return;const best=Number(scores[p.id]||0),top=topOpponent(p);if(best>top){const current=rewards[p.id];if(!current||Number(current.score)!==best){const r=issueReward(p.id,best);if(r)showRewardNotification(r)}else if(!current.notifiedAt){showRewardNotification(current)}}})}
function addRewardToCart(rewardId){const r=Object.values(rewards).find(x=>x.id===rewardId);if(!r){showToast('❌ جایزه پیدا نشد.');return}if(r.used){showToast('❌ این کد قبلاً استفاده شده است.');return}if(r.expiresAt&&r.expiresAt<Date.now()){showToast('❌ اعتبار این کد تمام شده است.');return}const p=products.find(x=>x.id===r.productId);if(!p){showToast('❌ محصول جایزه پیدا نشد.');return}if(!cart.includes(p.id))cart.push(p.id);cartDeals[p.id]=r.id;save();syncCloud();showToast(`🎁 ${r.discount}% تخفیف برای ${p.name} اعمال شد.`)}
function competitionRanks(p){const arr=[...competitorList(p)];const my=scores[p.id];if(Number(my)>0)arr.push({name:user.username||'شما',score:Number(my),me:true});return arr.sort((a,b)=>b.score-a.score).slice(0,5)}
function showCompetitionResults(id){const p=products.find(x=>x.id===id);if(!p)return;const ranks=competitionRanks(p);openModal(`<div class="modalhead"><div><span class="tag">${esc(p.name)}</span><h2>🏆 نتایج مسابقه</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="card" style="padding:16px"><p class="muted">مسابقه ${competitionEnded(p)?'به پایان رسیده است':'در حال برگزاری است'} • بازی: ${esc(gameName(p.game))}</p>${ranks.length?ranks.map((r,i)=>`<div class="rank ${r.me?'me':''}"><span class="ranknum">${i+1}</span><b>${esc(r.name)}</b><span style="margin-right:auto">${Number(r.score).toLocaleString('fa-IR')}</span></div>`).join(''):'<p class="muted">هنوز امتیازی ثبت نشده است.</p>'}</div><div class="cardactions"><button class="secondary" onclick="closeModal()">بستن</button>${!competitionEnded(p)?`<button class="primary" onclick="closeModal();startGame(${p.id})">🎮 ادامه بازی</button>`:''}</div>`)}
function showRewardNotification(r){if(!r||window.rewardNoticeId===r.id)return;window.rewardNoticeId=r.id;if(rewards[r.productId]&&rewards[r.productId].id===r.id){rewards[r.productId].notifiedAt=Date.now();saveLocal();syncCloud()}openModal(`<div class="modalhead"><div></div><button class="close" aria-label="بستن" onclick="closeModal()">×</button></div><div class="reward-pop"><div style="font-size:58px">🏆</div><h2>🎉 برنده شدی!</h2><p>زمان مسابقه تمام شده و امتیاز تو از همه بیشتر بوده است.</p><p><b>${esc(r.productName)}</b> • ${esc(r.game)}</p><div class="code">${r.code}</div><p><b>${r.discount}% تخفیف</b></p><p class="muted">کد جدید در «جوایز من» ذخیره شد و برای همین محصول قابل استفاده است. اگر قبلاً برای همین محصول جایزه داشتی، کد قبلی با این کد جدید جایگزین شده است.</p><div class="cardactions"><button class="primary" onclick="addRewardToCart('${esc(r.id)}');closeModal();go('cart')">🛒 خرید همین محصول با تخفیف</button><button class="secondary" onclick="closeModal();go('rewards')">🎁 جوایز من</button></div></div>`)}

function renderCart(a){const ps=cart.map(id=>products.find(p=>p.id===id)).filter(Boolean);const items=ps.map(p=>{const r=cartDeals[p.id]?Object.values(rewards).find(x=>x.id===cartDeals[p.id]):null;const price=r&&!r.used&&(!r.expiresAt||r.expiresAt>Date.now())?Math.round(p.price*(1-r.discount/100)):p.price;return {p,r:r&&price<p.price?r:null,price}});const total=items.reduce((s,x)=>s+x.price,0);a.innerHTML=`<section class="section"><div class="sectionhead"><div><h2>🛒 سبد خرید</h2><span class="muted">${ps.length} محصول</span></div></div>${ps.length?`<div class="cards">${items.map(x=>`<div class="card"><div class="productimg">${imgHtml(x.p)}</div><div class="cardbody"><b>${esc(x.p.name)}</b><p>${x.r?`<span class="old">${money(x.p.price)}</span> <b class="price">${money(x.price)}</b><span class="discount" style="margin-right:8px">${x.r.discount}% تخفیف</span>`:`<b class="price">${money(x.price)}</b>`}</p>${x.r?`<div class="muted">کد برنده‌شده: ${esc(x.r.code)}</div>`:''}<button class="danger" style="margin-top:10px" onclick="cart=cart.filter(x=>x!==${x.p.id});delete cartDeals[${x.p.id}];save();render()">حذف</button></div></div>`).join('')}</div><div class="card" style="padding:20px;margin-top:18px"><h3 style="margin-top:0">🎟️ کد تخفیف</h3><p class="muted">اگر برنده شده‌ای ولی هنوز از لینک خرید استفاده نکرده‌ای، کد خودت را اینجا وارد کن.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="cartCouponInput" style="flex:1;min-width:180px" placeholder="مثلاً BIEN-TV50-XXXXX"><button class="secondary" onclick="applyCouponFromCart()">اعمال کد</button></div></div><div class="card" style="padding:20px;margin-top:18px"><div class="row"><b>جمع کل</b><b class="price">${money(total)}</b></div><button class="primary" style="margin-top:14px;width:100%" onclick="checkout()">ادامه و ثبت سفارش</button></div>`:`<div class="card" style="padding:40px;text-align:center"><div style="font-size:50px">🛒</div><h3>سبد خرید خالی است</h3><div class="card" style="padding:18px;margin-top:16 button></div>')">پرداخت و ثبت سفارش</button>`)}

function editCategory(id=null){const c=id?categories.find(x=>x.id===id):{id:'cat_'+Date.now(),name:'',icon:'🛍️'};openModal(`<div class="modalhead"><h2>${id?'ویرایش دسته‌بندی':'افزودن دسته‌بندی'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>نام دسته‌بندی</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>آیکن</label><input id="ci" value="${esc(c.icon)}" placeholder="مثلاً 📱"></div></div><button class="primary" style="margin-top:15px;width:100%" onclick="saveCategory('${c.id}')">ذخیره</button>`)}
function saveCategory(id){const n=document.getElementById('cn').value.trim();if(!n){showToast('نام دسته‌بندی را وارد کن.');return}const c=categories.find(x=>x.id===id);if(c){c.name=n;c.icon=document.getElementById('ci').value.trim()||'🛍️'}else categories.push({id,name:n,icon:document.getElementById('ci').value.trim()||'🛍️'});save();syncCloud();closeModal();render();showToast('دسته‌بندی ذخیره شد')}
function deleteCategory(id){if(categories.length<=1){showToast('حداقل یک دسته‌بندی باید باقی بماند.');return}const count=products.filter(p=>p.cat===id).length;if(count&& !confirm(`این دسته ${count} محصول دارد. با حذف آن، این محصولات به دسته اول منتقل می‌شوند. ادامه؟`))return;const fallback=categories.find(c=>c.id!==id);products.forEach(p=>{if(p.cat===id)p.cat=fallback.id});categories=categories.filter(c=>c.id!==id);save();syncCloud();render();showToast('دسته‌بندی حذف شد')}
function editProduct(id=null){const base=id?products.find(x=>x.id===id):{id:Date.now(),name:'',brand:'',cat:categories[0]?.id||'',price:0,img:'',stock:1,desc:'',spec:'',competition:false,isDemo:false,discount:50,end:Date.now()+60*60000,game:'puzzle',freeAttempts:3,configuredDurationMinutes:60,pack:'اصلی',opponents:[{name:'Ali88',score:18920},{name:'Sara23',score:17400},{name:'Reza77',score:16050},{name:'Nika55',score:15100},{name:'Mina42',score:14200}]};const p=JSON.parse(JSON.stringify(base));p.opponents=Array.isArray(p.opponents)?p.opponents:[{name:'Ali88',score:18920},{name:'Sara23',score:17400},{name:'Reza77',score:16050},{name:'Nika55',score:15100},{name:'Mina42',score:14200}];const remaining=Math.max(1,Number(p.configuredDurationMinutes)||Math.ceil(Math.max(0,(p.end-Date.now())/60000))||60);openModal(`<div class="modalhead"><div><h2>${id?'ویرایش محصول':'افزودن محصول'}</h2><span class="muted">تنظیمات مسابقه اینجا ذخیره می‌شود و روی دستگاه‌های دیگر هم دیده می‌شود.</span></div><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field full"><label>نام محصول</label><input id="pn" value="${esc(p.name)}"></div><div class="field"><label>برند</label><input id="pb" value="${esc(p.brand)}"></div><div class="field"><label>دسته‌بندی</label><select id="pc">${categories.map(c=>`<option value="${c.id}" ${p.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>قیمت (تومان)</label><input id="pp" type="number" min="0" value="${p.price}"></div><div class="field"><label>موجودی</label><input id="pi" type="number" min="0" value="${p.stock}"></div><div class="field"><label>نوع بسته‌بندی</label><select id="pack"><option ${p.pack==='اصلی'?'selected':''}>اصلی</option><option ${p.pack==='هدیه'?'selected':''}>هدیه</option><option ${p.pack==='اقتصادی'?'selected':''}>اقتصادی</option><option ${p.pack==='ویژه'?'selected':''}>ویژه</option></select></div><div class="field"><label>زمان باقی‌مانده مسابقه (دقیقه)</label><input id="premain" type="number" min="1" value="${remaining}"><small class="muted">از همین لحظه تا پایان مسابقه.</small></div><div class="field full"><label>تصویر محصول — JPEG / JPG / PNG</label><input id="pfile" type="file" accept="image/jpeg,image/jpg,image/png"><small class="muted">یا URL تصویر را وارد کن:</small><input id="pimg" value="${esc(p.img)}" placeholder="https://..."><div class="preview" style="margin-top:8px"><img id="imgpreview" src="${esc(p.img)}" onerror="this.style.opacity=.25"><span class="muted">تصویر انتخابی اینجا نمایش داده می‌شود.</span></div></div><div class="field full"><label>توضیحات</label><textarea id="pd">${esc(p.desc)}</textarea></div><div class="field full"><label>مشخصات</label><input id="ps" value="${esc(p.spec)}"></div><div class="field"><label>فروش با مسابقه؟</label><select id="pco"><option value="false" ${!p.competition?'selected':''}>خیر — فروش عادی</option><option value="true" ${p.competition?'selected':''}>بله — مسابقه</option></select></div><div class="field"><label>درصد تخفیف برنده</label><input id="pdis" type="number" min="0" max="100" value="${p.discount||0}"></div><div class="field"><label>نوع بازی</label><select id="pg"><option value="puzzle" ${p.game==='puzzle'?'selected':''}>🧩 پازل ۴×۴</option><option value="puzzlePlace" ${p.game==='puzzlePlace'?'selected':''}>🧩 پازل جایگذاری قطعات</option><option value="runner" ${p.game==='runner'?'selected':''}>🏃 بپر بپر</option><option value="target" ${p.game==='target'?'selected':''}>🎯 شکار تخفیف</option><option value="snake" ${p.game==='snake'?'selected':''}>🐍 مار و پله</option></select></div><div class="field"><label>تعداد فرصت رایگان</label><input id="pfa" type="number" min="0" max="99" value="${p.freeAttempts??3}"></div><div class="field full"><label>امتیاز ثابت شرکت‌کنندگان نمایشی</label><div class="formgrid"><div class="field"><label>نفر ۱</label><input id="o1n" value="${esc(p.opponents[0]?.name||'Ali88')}"><input id="o1s" type="number" min="0" value="${Number(p.opponents[0]?.score||0)}"></div><div class="field"><label>نفر ۲</label><input id="o2n" value="${esc(p.opponents[1]?.name||'Sara23')}"><input id="o2s" type="number" min="0" value="${Number(p.opponents[1]?.score||0)}"></div><div class="field"><label>نفر ۳</label><input id="o3n" value="${esc(p.opponents[2]?.name||'Reza77')}"><input id="o3s" type="number" min="0" value="${Number(p.opponents[2]?.score||0)}"></div><div class="field"><label>نفر ۴</label><input id="o4n" value="${esc(p.opponents[3]?.name||'Nika55')}"><input id="o4s" type="number" min="0" value="${Number(p.opponents[3]?.score||0)}"></div><div class="field"><label>نفر ۵</label><input id="o5n" value="${esc(p.opponents[4]?.name||'Mina42')}"><input id="o5s" type="number" min="0" value="${Number(p.opponents[4]?.score||0)}"></div></div><small class="muted">این امتیازها ثابت‌اند و خودکار تغییر نمی‌کنند؛ فقط شما از پنل مدیریت تغییرشان می‌دهی.</small></div></div><button class="primary" style="margin-top:16px;width:100%" onclick="saveProduct(${id||'null'})">ذخیره محصول و تنظیمات مسابقه</button>`);document.getElementById('pfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(jpeg|jpg|png)$/.test(f.type)){showToast('فقط JPEG/JPG/PNG قابل قبول است.');e.target.value='';return}if(f.size>5*1024*1024){showToast('حجم عکس را زیر ۵ مگابایت نگه دار.');e.target.value='';return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let max=700,q=.62,data='';for(let i=0;i<5;i++){const scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);data=c.toDataURL('image/jpeg',q);if(data.length<56000)break;max*=.8;q*=.88}document.getElementById('pimg').value=data;document.getElementById('imgpreview').src=data;document.getElementById('imgpreview').style.opacity=1};im.src=r.result};r.readAsDataURL(f)})}
function saveProduct(id){const p=id?products.find(x=>x.id===id):{id:Date.now(),isDemo:false};Object.assign(p,{name:document.getElementById('pn').value.trim(),brand:document.getElementById('pb').value.trim(),cat:document.getElementById('pc').value,price:Number(document.getElementById('pp').value)||0,stock:Number(document.getElementById('pi').value)||0,pack:document.getElementById('pack').value,img:document.getElementById('pimg').value.trim(),desc:document.getElementById('pd').value.trim(),spec:document.getElementById('ps').value.trim(),competition:document.getElementById('pco').value==='true',discount:Math.min(100,Math.max(0,Number(document.getElementById('pdis').value)||0)),game:document.getElementById('pg').value,freeAttempts:Math.max(0,Number(document.getElementById('pfa').value)||0),configuredDurationMinutes:Math.max(1,Number(document.getElementById('premain').value)||60),end:Date.now()+Math.max(1,Number(document.getElementById('premain').value)||60)*60000,opponents:[{name:document.getElementById('o1n').value.trim()||'Ali88',score:Math.max(0,Number(document.getElementById('o1s').value)||0)},{name:document.getElementById('o2n').value.trim()||'Sara23',score:Math.max(0,Number(document.getElementById('o2s').value)||0)},{name:document.getElementById('o3n').value.trim()||'Reza77',score:Math.max(0,Number(document.getElementById('o3s').value)||0)},{name:document.getElementById('o4n').value.trim()||'Nika55',score:Math.max(0,Number(document.getElementById('o4s').value)||0)},{name:document.getElementById('o5n').value.trim()||'Mina42',score:Math.max(0,Number(document.getElementById('o5s').value)||0)}]});if(!id)products.push(p);save();closeModal();render();showToast('محصول و تنظیمات مسابقه ذخیره شد؛ همگام‌سازی ابری انجام می‌شود.');setTimeout(()=>syncCloud(),50)}
function deleteProduct(id){if(confirm('این محصول حذف شود؟')){products=products.filter(p=>p.id!==id);cart=cart.filter(x=>x!==id);delete attempts[id];delete scores[id];delete rewards[id];save();syncCloud();render();showToast('محصول حذف شد')}}
function resetAttempts(id){attempts[id]=0;scores[id]=0;delete rewards[id];save();render();showToast('فرصت‌ها و رکورد این محصول برای دمو ریست شد')}
async function resetDemoScenario(){
if(!confirm('سناریوی دمو از آخرین تنظیمات ذخیره‌شده در مدیریت دوباره شروع شود؟ زمان مسابقات، امتیازها، فرصت‌ها، سبد و کدهای تخفیف به وضعیت شروع برمی‌گردند.'))return;
demoScenarioId='demo_'+Date.now();localStorage.setItem('bb_demoScenarioId',demoScenarioId);rewards={};attempts={};scores={};cart=[];cartDeals={};window.rewardNoticeId=null;
products.forEach(p=>{if(p.competition){p.scenarioId=demoScenarioId;p.competitionStartedAt=0;p.end=0;if(!Array.isArray(p.opponents)||p.opponents.length<5){p.opponents=[{name:'Ali88',score:18920},{name:'Sara23',score:17400},{name:'Reza77',score:16050},{name:'Nika55',score:15100},{name:'Mina42',score:14200}]}}});
saveLocal();cloudReady=false;showToast('🎬 سناریوی دمو ریست شد؛ هر مسابقه زمان خودش را از اولین ورود شروع می‌کند.');render();try{await syncCloud();cloudReady=true}catch(e){}
}

function resetDemo(){if(confirm('همه تغییرات محلی این دستگاه پاک شود و اطلاعات ابری دوباره دریافت شود؟')){['bb_categories','bb_products','bb_user','bb_attempts','bb_scores','bb_rewards','bb_cart','bb_cartDeals'].forEach(k=>localStorage.removeItem(k));location.reload()}}
function updateTimers(){document.querySelectorAll('[data-end]').forEach(el=>{const diff=Math.max(0,Number(el.dataset.end)-Date.now());const h=Math.floor(diff/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);el.textContent=diff?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:'پایان یافت'})}
setInterval(()=>{updateTimers();checkCompetitionEnds();if(!gameRunning&&(page==='home'||page==='competitions'))render()},1000);document.getElementById('app').innerHTML='<section class="section"><div class="card" style="padding:45px;text-align:center"><div style="font-size:48px">☁️</div><h2>در حال دریافت آخرین تنظیمات...</h2><p class="muted">لطفاً چند لحظه صبر کن تا محصولات و مسابقات تنظیم‌شده نمایش داده شوند.</p></div></section>';cloudLoad().then(()=>{if(!cloudReady){render()}});if(sessionStorage.getItem('bb_update_notice')){sessionStorage.removeItem('bb_update_notice');setTimeout(()=>showToast('✅ آخرین نسخه سایت با موفقیت دریافت شد'),500)}if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
// پایش پایان مسابقات حتی وقتی کاربر در صفحه دیگری است یا از پس‌زمینه گوشی برمی‌گردد.
window.addEventListener('focus',async()=>{if(gameRunning)return;const ok=await cloudLoad();if(ok)checkCompetitionEnds()});
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&!gameRunning){const ok=await cloudLoad();if(ok)checkCompetitionEnds()}});

</script>
</body></html>
