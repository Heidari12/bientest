<body>
<header><div class="container nav">
  <div class="mobile-menu"><button class="iconbtn" onclick="toggleMobileNav()">☰</button></div>
  <div class="logo"><img class="brand-logo" src="logo.png" alt="BIEN BOARD"></div>
  <nav class="navlinks" id="navlinks"><a onclick="go('home')">خانه</a><a onclick="go('shop')">فروشگاه</a><a onclick="go('competitions')">مسابقات</a><a onclick="go('winners')">برندگان</a><a onclick="go('admin')">مدیریت</a></nav>
  <div class="search"><span>⌕</span><input id="search" placeholder="جستجوی محصول..." oninput="render()"></div>
  <div class="actions"><button class="iconbtn" onclick="go('cart')">🛒 <span id="cartCount">0</span></button><button class="profilebtn" onclick="openProfile()">ورود / ثبت‌نام</button></div>
</div></header>
<main class="container" id="app"></main>
<footer class="footer"><div class="container"><div class="logo"><img class="brand-logo" src="logo.png" alt="BIEN BOARD"></div><p>بازی کن، رقابت کن، با تخفیف بخر.</p><small>نسخه Demo / Prototype — قابل ویرایش از پنل مدیریت</small></div></footer>
<div class="overlay" id="modal"><div class="modal" id="modalBody"></div></div><div id="toast"></div>
<script>
const icons={digital:'📺',gadgets:'📱',home:'🏠',fun:'🎮',beauty:'💄',kitchen:'☕',other:'🛍️'};
const remote={tv:'https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=900&q=85',phone:'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=900&q=85',airpods:'https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=900&q=85',ps:'https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=900&q=85',coffee:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=85',vacuum:'https://images.unsplash.com/photo-1558317374-067fb5f30001?auto=format&fit=crop&w=900&q=85',switch:'https://images.unsplash.com/photo-1578303512597-81e6cc155b3e?auto=format&fit=crop&w=900&q=85',beauty:'https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=900&q=85'};
const defaultCategories=[{id:'digital',name:'لوازم دیجیتال',icon:'📺'},{id:'gadgets',name:'موبایل و گجت',icon:'📱'},{id:'home',name:'لوازم خانگی',icon:'🏠'},{id:'fun',name:'سرگرمی و بازی',icon:'🎮'},{id:'beauty',name:'آرایشی و بهداشتی',icon:'💄'},{id:'kitchen',name:'خانه و آشپزخانه',icon:'☕'}];
const seed=[
{id:1,name:'تلویزیون هوشمند Samsung 48 اینچ',brand:'Samsung',cat:'digital',price:200000000,img:remote.tv,stock:1,desc:'تلویزیون هوشمند با نمایشگر باکیفیت و طراحی باریک؛ مناسب خانه‌های مدرن.',spec:'48 اینچ • 4K • Smart TV • Wi‑Fi',competition:true,discount:50,end:Date.now()+18*3600e3,game:'runner',freeAttempts:3,pack:'اصلی'},
{id:2,name:'Apple AirPods Pro',brand:'Apple',cat:'gadgets',price:32000000,img:remote.airpods,stock:1,desc:'هدفون بی‌سیم با حذف نویز فعال و تجربه صوتی فراگیر.',spec:'ANC • Bluetooth • USB‑C',competition:true,discount:40,end:Date.now()+26*3600e3,game:'puzzle',freeAttempts:3,pack:'اصلی'},
{id:3,name:'PlayStation 5 Slim',brand:'Sony',cat:'fun',price:65000000,img:remote.ps,stock:1,desc:'کنسول نسل جدید برای تجربه بازی‌های روز.',spec:'SSD • 4K • HDMI • DualSense',competition:true,discount:35,end:Date.now()+42*3600e3,game:'target',freeAttempts:3,pack:'اصلی'},
{id:4,name:'اسپرسوساز خانگی',brand:'DeLonghi',cat:'kitchen',price:28000000,img:remote.coffee,stock:1,desc:'اسپرسوساز جمع‌وجور برای تهیه قهوه حرفه‌ای در خانه.',spec:'15 bar • نازل بخار • مخزن آب',competition:false,discount:0,end:Date.now()+24*3600e3,game:'puzzle',freeAttempts:0,pack:'اصلی'},
{id:5,name:'جاروبرقی بدون کیسه',brand:'Bosch',cat:'home',price:18000000,img:remote.vacuum,stock:1,desc:'جاروبرقی قدرتمند و کم‌صدا با طراحی کاربردی.',spec:'1800W • فیلتر HEPA • بدون کیسه',competition:false,discount:0,end:Date.now()+24*3600e3,game:'runner',freeAttempts:0,pack:'اصلی'},
{id:6,name:'Samsung Galaxy S Series',brand:'Samsung',cat:'gadgets',price:78000000,img:remote.phone,stock:1,desc:'گوشی هوشمند پرچمدار با دوربین حرفه‌ای و نمایشگر باکیفیت.',spec:'AMOLED • 5G • دوربین چندگانه',competition:false,discount:0,end:Date.now()+24*3600e3,game:'target',freeAttempts:0,pack:'اصلی'},
{id:7,name:'Nintendo Switch OLED',brand:'Nintendo',cat:'fun',price:42000000,img:remote.switch,stock:1,desc:'کنسول قابل حمل برای بازی در خانه و بیرون.',spec:'OLED • 64GB • Portable',competition:false,discount:0,end:Date.now()+24*3600e3,game:'target',freeAttempts:0,pack:'اصلی'},
{id:8,name:'ست مراقبت و زیبایی',brand:'Beauty Lab',cat:'beauty',price:12500000,img:remote.beauty,stock:1,desc:'مجموعه کاربردی مراقبت شخصی برای استفاده روزمره.',spec:'چند ابزار • شارژی • قابل حمل',competition:false,discount:0,end:Date.now()+24*3600e3,game:'puzzle',freeAttempts:0,pack:'اصلی'}
];
let categories=load('bb_categories',null)||defaultCategories;
let products=load('bb_products',null)||seed;
let user=load('bb_user',null)||{name:'مهمان',username:'Guest',phone:''};
let attempts=load('bb_attempts',{})||{};
let scores=load('bb_scores',{})||{};
let cart=load('bb_cart',[])||[];
let page='home',selectedCat='all',gameRunning=false;
function load(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function save(){try{localStorage.setItem('bb_categories',JSON.stringify(categories));localStorage.setItem('bb_products',JSON.stringify(products));localStorage.setItem('bb_user',JSON.stringify(user));localStorage.setItem('bb_attempts',JSON.stringify(attempts));localStorage.setItem('bb_scores',JSON.stringify(scores));localStorage.setItem('bb_cart',JSON.stringify(cart));return true}catch(e){showToast('فضای ذخیره مرورگر پر شده است؛ از «نسخه پشتیبان» استفاده کن.');return false}}
function downloadBackup(){const data={app:'BIEN BOARD',version:2,savedAt:new Date().toISOString(),categories,products,user,attempts,scores,cart};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BIEN-BOARD-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('نسخه پشتیبان دانلود شد. روی دستگاه دیگر می‌توانی آن را بازیابی کنی.')}
function importBackupFile(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.app!=='BIEN BOARD'||!Array.isArray(d.products)||!Array.isArray(d.categories))throw new Error('bad');categories=d.categories;products=d.products;user=d.user||user;attempts=d.attempts||{};scores=d.scores||{};cart=d.cart||[];save();render();showToast('نسخه پشتیبان با موفقیت بازیابی شد.')}catch(e){showToast('فایل پشتیبان معتبر نیست.')}};r.readAsText(f);input.value=''}
function money(n){return new Intl.NumberFormat('fa-IR').format(Number(n)||0)+' تومان'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function catName(id){return categories.find(c=>c.id===id)?.name||'بدون دسته'}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.style.display='none',2600)}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none';gameRunning=false;document.onkeydown=null}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function toggleMobileNav(){const n=document.getElementById('navlinks');n.style.display=n.style.display==='flex'?'none':'flex';n.style.position='absolute';n.style.top='64px';n.style.right='3%';n.style.background='#fff';n.style.padding='12px';n.style.borderRadius='15px';n.style.flexDirection='column';n.style.boxShadow='var(--shadow)'}
function go(p){page=p;document.getElementById('navlinks').style.display='';render();scrollTo(0,0)}
function addCart(id){if(!cart.includes(id))cart.push(id);save();render();showToast('محصول به سبد خرید اضافه شد.')}

function imgHtml(p,cls=''){return `${p.img?`<img class="${cls}" src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:''}<span class="placeholder" style="display:${p.img?'none':'grid'}">${icons[p.cat]||'🛍️'}</span>`}

function puzzleGame(p){gameRunning=true;const start=Date.now();let moves=0,left=90,sel=null;const size=3;let board=[0,1,2,3,4,5,6,7,8];function neighbors(i){const r=Math.floor(i/size),c=i%size,a=[];if(r>0)a.push(i-size);if(r<size-1)a.push(i+size);if(c>0)a.push(i-1);if(c<size-1)a.push(i+1);return a}for(let k=0,prev=-1;k<55;k++){const opts=neighbors(board.indexOf(8)).filter(x=>x!==prev);const pick=opts[Math.floor(Math.random()*opts.length)];const blank=board.indexOf(8);[board[blank],board[pick]]=[board[pick],board[blank]];prev=blank}openModal(`<div class="modalhead"><div><span class="tag">${esc(p.name)}</span><h2>🧩 پازل تصویری</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="gamebox"><div class="game-hud"><span class="hudpill">زمان: <b id="ptime">90</b> ثانیه</span><span class="hudpill">حرکت: <b id="pmoves">0</b></span><span class="hudpill">مرحله: <b>۳×۳</b></span></div><p class="puzzle-help">قطعه‌ها را با لمس جابه‌جا کن و تصویر محصول را کامل کن. فقط قطعه کنار خانه خالی حرکت می‌کند.</p><div class="puzzle-board" id="pboard"></div><button class="secondary" style="width:100%" onclick="closeModal()">خروج از بازی</button></div>`);const boardEl=document.getElementById('pboard');const image=p.img||'';function solved(){return board.every((v,i)=>v===i)}function draw(){boardEl.innerHTML=board.map((v,i)=>{if(v===8)return `<button class="puzzle-piece blank" aria-label="خانه خالی"></button>`;const row=Math.floor(v/size),col=v%size;return `<button class="puzzle-piece ${sel===i?'selected':''}" data-i="${i}"><span class="tileimg" style="background-image:url('${esc(image)}');background-position:${col*50}% ${row*50}%"></span></button>`}).join('');boardEl.querySelectorAll('.puzzle-piece:not(.blank)').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.i),blank=board.indexOf(8);if(!neighbors(blank).includes(i))return;if(sel===i){sel=null;draw();return}[board[blank],board[i]]=[board[i],board[blank]];moves++;sel=null;document.getElementById('pmoves').textContent=moves;draw();if(solved())finishPuzzle(p,start,moves)})}draw();const tick=setInterval(()=>{if(!gameRunning){clearInterval(tick);return}left--;const el=document.getElementById('ptime');if(el)el.textContent=left;if(left<=0){clearInterval(tick);gameRunning=false;finishGame(p.id,Math.max(300,Math.round(15000-left*10-moves*15)),90)}},1000)}
function finishPuzzle(p,start,moves){if(!gameRunning)return;gameRunning=false;const elapsed=(Date.now()-start)/1000;const score=Math.max(1000,Math.round(30000-elapsed*260-moves*45));finishGame(p.id,score,elapsed)}
function runnerGame(p){gameRunning=true;let score=0,alive=true,start=Date.now(),last=performance.now(),x=0,jumpY=0,vy=0,obstacles=[],coins=[];openModal(`<div class="modalhead"><div><span class="tag">${esc(p.name)}</span><h2>🏃 بپر بپر</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="gamebox"><div class="game-hud"><span class="hudpill">امتیاز: <b id="rscore">0</b></span><span class="hudpill">زمان: <b id="rtime">0</b></span><span class="hudpill">پرش: لمس صفحه / Space</span></div><div class="gamecanvas" id="runnerArea"><div class="lane"></div><div class="road"></div><div class="runnerPlayer" id="player">📺</div></div><button class="jumpbtn" id="jumpBtn">⬆️ پرش</button></div>`);const area=document.getElementById('runnerArea'),player=document.getElementById('player');let spawn=0,coinSpawn=0;function jump(){if(jumpY===0){vy=12}}document.getElementById('jumpBtn').onclick=jump;area.addEventListener('pointerdown',e=>{if(e.target===area||e.target.closest('.runnerPlayer'))jump()});document.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();jump()}};function makeObstacle(){const el=document.createElement('div');el.className='runnerObstacle';el.textContent='🧱';el.style.left=(area.clientWidth+30)+'px';area.appendChild(el);obstacles.push({el,x:area.clientWidth+30})}function makeCoin(){const el=document.createElement('div');el.className='runnerCoin';el.textContent='★';el.style.left=(area.clientWidth+30)+'px';area.appendChild(el);coins.push({el,x:area.clientWidth+30,y:145})}function hit(a,b){const r1=a.getBoundingClientRect(),r2=b.getBoundingClientRect();return r1.left<r2.right-8&&r1.right>r2.left+8&&r1.top<r2.bottom-8&&r1.bottom>r2.top+8}function loop(t){if(!alive)return;const dt=Math.min(2,(t-last)/16.67);last=t;const elapsed=(Date.now()-start)/1000;document.getElementById('rscore').textContent=Math.floor(score).toLocaleString('fa-IR');document.getElementById('rtime').textContent=Math.floor(elapsed).toLocaleString('fa-IR');score+=dt*(5+elapsed*.35);jumpY+=vy*dt;vy-=.72*dt;if(jumpY<0){jumpY=0;vy=0}player.style.bottom=(78+jumpY)+'px';spawn+=dt;coinSpawn+=dt;const speed=4.1+elapsed*.16;if(spawn>70){spawn=0;makeObstacle()}if(coinSpawn>95){coinSpawn=0;makeCoin()}obstacles.forEach(o=>{o.x-=speed*dt;o.el.style.left=o.x+'px';if(o.x<-70){o.el.remove();o.dead=true}if(!o.dead&&hit(player,o.el)){alive=false;setTimeout(()=>{closeModal();finishGame(p.id,Math.round(score),elapsed)},180)}});coins.forEach(c=>{c.x-=speed*dt;c.el.style.left=c.x+'px';if(c.x<-60){c.el.remove();c.dead=true}if(!c.dead&&hit(player,c.el)){score+=250;c.el.remove();c.dead=true}});obstacles=obstacles.filter(o=>!o.dead);coins=coins.filter(o=>!o.dead);if(alive)requestAnimationFrame(loop)}requestAnimationFrame(loop)}
function targetGame(p){gameRunning=true;let start=Date.now(),score=0,hits=0,time=20,combo=0;openModal(`<div class="modalhead"><div><span class="tag">${esc(p.name)}</span><h2>🎯 شکار تخفیف</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="gamebox"><div class="game-hud"><span class="hudpill">امتیاز: <b id="tscore">0</b></span><span class="hudpill">زمان: <b id="ttime">20</b></span><span class="hudpill">اصابت: <b id="thits">0</b></span></div><div class="tap-area" id="tapArea"><div class="target" id="target">٪</div></div><p style="color:#cbd5e1;font-size:12px;margin-bottom:0">هرچه سریع‌تر هدف را لمس کنی، امتیاز بیشتری می‌گیری. در موبایل با لمس مستقیم بازی کن.</p></div>`);const area=document.getElementById('tapArea'),target=document.getElementById('target');function place(){const pad=8,maxX=area.clientWidth-target.offsetWidth-pad,maxY=area.clientHeight-target.offsetHeight-pad;target.style.left=(pad+Math.random()*Math.max(1,maxX-pad))+'px';target.style.top=(pad+Math.random()*Math.max(1,maxY-pad))+'px'}function hitTarget(){if(!gameRunning)return;combo++;hits++;score+=100+combo*12;document.getElementById('tscore').textContent=score.toLocaleString('fa-IR');document.getElementById('thits').textContent=hits.toLocaleString('fa-IR');place()}target.addEventListener('pointerdown',e=>{e.preventDefault();hitTarget()});place();const tick=setInterval(()=>{if(!gameRunning){clearInterval(tick);return}time--;const el=document.getElementById('ttime');if(el)el.textContent=time;if(time<=0){clearInterval(tick);gameRunning=false;finishGame(p.id,Math.max(500,score),20)}},1000)}

function checkout(){openModal(`<div class="modalhead"><h2>ثبت سفارش Demo</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">پرداخت در نسخه Demo شبیه‌سازی می‌شود.</p><div class="formgrid"><div class="field"><label>نام و نام خانوادگی</label><input value="${esc(user.name)}"></div><div class="field"><label>شماره موبایل</label><input value="${esc(user.phone)}"></div><div class="field full"><label>آدرس</label><textarea placeholder="آدرس کامل"></textarea></div><div class="field"><label>کد پستی</label><input placeholder="۱۰ رقم"></div><div class="field"><label>شهر</label><input placeholder="شهر"></div></div><button class="primary" style="margin-top:15px;width:100%" onclick="cart=[];save();closeModal();openModal('<div class=winner><div style=font-size:45px>✓</div><h2>سفارش با موفقیت ثبت شد</h2><p>پرداخت در نسخه Demo شبیه‌سازی شده است.</p><button class=primary onclick=closeModal()>بازگشت</button></div>')">پرداخت و ثبت سفارش</button>`)}
function renderAdmin(a){a.innerHTML=`<section class="section"><div class="sectionhead"><div><h2>پنل مدیریت</h2><span class="muted">این بخش برای مدیریت صاحب کسب‌وکار است و در مسیر عمومی سرمایه‌گذار نمایش داده نمی‌شود.</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="secondary" onclick="downloadBackup()">💾 دانلود نسخه پشتیبان</button><button class="secondary" onclick="document.getElementById('backupInput').click()">📥 بازیابی</button><input id="backupInput" type="file" accept="application/json" style="display:none" onchange="importBackupFile(this)"><button class="secondary" onclick="resetDemo()">بازنشانی Demo</button></div></div><div class="admin-grid"><div class="stat"><span class="muted">محصولات</span><b>${products.length}</b></div><div class="stat"><span class="muted">مسابقات فعال</span><b>${products.filter(p=>p.competition&&p.end>Date.now()).length}</b></div><div class="stat"><span class="muted">دسته‌ها</span><b>${categories.length}</b></div><div class="stat"><span class="muted">محصولات دارای بازی</span><b>${products.filter(p=>p.competition).length}</b></div></div><div class="card" style="padding:18px;margin-top:18px"><div class="sectionhead"><div><h3 style="margin:0">دسته‌بندی‌ها</h3><span class="muted">افزودن، تغییر نام، تغییر آیکن و حذف</span></div><button class="primary" onclick="editCategory()">＋ دسته جدید</button></div><div class="adminlist">${categories.map(c=>`<div class="adminitem"><div><b>${esc(c.icon||'🛍️')} ${esc(c.name)}</b><div class="muted">${products.filter(p=>p.cat===c.id).length} محصول</div></div><div class="adminactions"><button class="secondary" onclick="editCategory('${c.id}')">ویرایش</button><button class="danger" onclick="deleteCategory('${c.id}')">حذف</button></div></div>`).join('')}</div></div><div class="card" style="padding:18px;margin-top:18px"><div class="sectionhead"><div><h3 style="margin:0">محصولات</h3><span class="muted">نام، جزئیات، قیمت، عکس، دسته، بازی و فرصت رایگان</span></div><button class="primary" onclick="editProduct()">＋ افزودن محصول</button></div><div class="adminlist">${products.map(p=>`<div class="adminitem"><div><b>${esc(p.name)}</b><div class="muted">${esc(catName(p.cat))} • ${money(p.price)} • ${p.competition?'دارای بازی':'فروش عادی'} • ${p.competition?`${p.freeAttempts} فرصت رایگان`:''}</div></div><div class="adminactions"><button class="secondary" onclick="editProduct(${p.id})">ویرایش</button><button class="mini" onclick="resetAttempts(${p.id})">ریست فرصت‌ها</button><button class="danger" onclick="deleteProduct(${p.id})">حذف</button></div></div>`).join('')}</div></div><div class="card" style="padding:18px;margin-top:18px"><h3 style="margin-top:0">نکته دمو</h3><p class="muted">تغییرات ابتدا به‌صورت خودکار روی همین دستگاه ذخیره می‌شوند. برای انتقال اطلاعات به گوشی یا کامپیوتر دیگر، «دانلود نسخه پشتیبان» را بزن و فایل JSON را در دستگاه مقصد از گزینه «بازیابی» وارد کن. این راهکار برای دموست؛ نسخه نهایی می‌تواند به دیتابیس ابری متصل شود.</p></div></section>`}
function editCategory(id=null){const c=id?categories.find(x=>x.id===id):{id:'cat_'+Date.now(),name:'',icon:'🛍️'};openModal(`<div class="modalhead"><h2>${id?'ویرایش دسته‌بندی':'افزودن دسته‌بندی'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>نام دسته‌بندی</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>آیکن</label><input id="ci" value="${esc(c.icon)}" placeholder="مثلاً 📱"></div></div><button class="primary" style="margin-top:15px;width:100%" onclick="saveCategory('${c.id}')">ذخیره</button>`)}
function saveCategory(id){const n=document.getElementById('cn').value.trim();if(!n){showToast('نام دسته‌بندی را وارد کن.');return}const c=categories.find(x=>x.id===id);if(c){c.name=n;c.icon=document.getElementById('ci').value.trim()||'🛍️'}else categories.push({id,name:n,icon:document.getElementById('ci').value.trim()||'🛍️'});save();closeModal();render();showToast('دسته‌بندی ذخیره شد')}
function deleteCategory(id){if(categories.length<=1){showToast('حداقل یک دسته‌بندی باید باقی بماند.');return}const count=products.filter(p=>p.cat===id).length;if(count&& !confirm(`این دسته ${count} محصول دارد. با حذف آن، این محصولات به دسته اول منتقل می‌شوند. ادامه؟`))return;const fallback=categories.find(c=>c.id!==id);products.forEach(p=>{if(p.cat===id)p.cat=fallback.id});categories=categories.filter(c=>c.id!==id);save();render();showToast('دسته‌بندی حذف شد')}
function editProduct(id=null){const p=id?products.find(x=>x.id===id):{id:Date.now(),name:'',brand:'',cat:categories[0]?.id||'',price:0,img:'',stock:1,desc:'',spec:'',competition:false,discount:50,end:Date.now()+24*3600e3,game:'puzzle',freeAttempts:3,pack:'اصلی'};openModal(`<div class="modalhead"><div><h2>${id?'ویرایش محصول':'افزودن محصول'}</h2><span class="muted">تمام اطلاعات محصول از اینجا قابل تغییر است.</span></div><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field full"><label>نام محصول</label><input id="pn" value="${esc(p.name)}"></div><div class="field"><label>برند</label><input id="pb" value="${esc(p.brand)}"></div><div class="field"><label>دسته‌بندی</label><select id="pc">${categories.map(c=>`<option value="${c.id}" ${p.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>قیمت (تومان)</label><input id="pp" type="number" min="0" value="${p.price}"></div><div class="field"><label>موجودی</label><input id="pi" type="number" min="0" value="${p.stock}"></div><div class="field"><label>نوع بسته‌بندی</label><select id="pack"><option ${p.pack==='اصلی'?'selected':''}>اصلی</option><option ${p.pack==='هدیه'?'selected':''}>هدیه</option><option ${p.pack==='اقتصادی'?'selected':''}>اقتصادی</option><option ${p.pack==='ویژه'?'selected':''}>ویژه</option></select></div><div class="field"><label>مدت مسابقه (ساعت)</label><input id="ph" type="number" min="1" value="${Math.max(1,Math.round((p.end-Date.now())/3600000))}"></div><div class="field full"><label>تصویر محصول — JPEG / JPG / PNG</label><input id="pfile" type="file" accept="image/jpeg,image/jpg,image/png"><small class="muted">یا URL تصویر را وارد کن:</small><input id="pimg" value="${esc(p.img)}" placeholder="https://..."><div class="preview" style="margin-top:8px"><img id="imgpreview" src="${esc(p.img)}" onerror="this.style.opacity=.25"><span class="muted">تصویر انتخابی اینجا نمایش داده می‌شود.</span></div></div><div class="field full"><label>توضیحات</label><textarea id="pd">${esc(p.desc)}</textarea></div><div class="field full"><label>مشخصات</label><input id="ps" value="${esc(p.spec)}"></div><div class="field"><label>فروش با بازی؟</label><select id="pco"><option value="false" ${!p.competition?'selected':''}>خیر — فروش عادی</option><option value="true" ${p.competition?'selected':''}>بله — مسابقه</option></select></div><div class="field"><label>درصد تخفیف برنده</label><input id="pdis" type="number" min="0" max="100" value="${p.discount||0}"></div><div class="field"><label>نوع بازی</label><select id="pg"><option value="puzzle" ${p.game==='puzzle'?'selected':''}>🧩 پازل سرعتی</option><option value="runner" ${p.game==='runner'?'selected':''}>🏃 بپر بپر</option><option value="target" ${p.game==='target'?'selected':''}>🎯 شکار تخفیف</option></select></div><div class="field"><label>تعداد فرصت رایگان</label><input id="pfa" type="number" min="0" max="99" value="${p.freeAttempts??3}"></div></div><button class="primary" style="margin-top:16px;width:100%" onclick="saveProduct(${id||'null'})">ذخیره محصول</button>`);document.getElementById('pfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(jpeg|jpg|png)$/.test(f.type)){showToast('فقط JPEG/JPG/PNG قابل قبول است.');e.target.value='';return}if(f.size>3*1024*1024){showToast('برای دمو حجم عکس را زیر ۳ مگابایت نگه دار.');e.target.value='';return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));const ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.78);document.getElementById('pimg').value=data;document.getElementById('imgpreview').src=data;document.getElementById('imgpreview').style.opacity=1};im.src=r.result};r.readAsDataURL(f)})}
function saveProduct(id){const p=id?products.find(x=>x.id===id):{id:Date.now()};Object.assign(p,{name:document.getElementById('pn').value.trim(),brand:document.getElementById('pb').value.trim(),cat:document.getElementById('pc').value,price:Number(document.getElementById('pp').value)||0,stock:Number(document.getElementById('pi').value)||0,pack:document.getElementById('pack').value,img:document.getElementById('pimg').value.trim(),desc:document.getElementById('pd').value.trim(),spec:document.getElementById('ps').value.trim(),competition:document.getElementById('pco').value==='true',discount:Math.min(100,Math.max(0,Number(document.getElementById('pdis').value)||0)),game:document.getElementById('pg').value,freeAttempts:Math.max(0,Number(document.getElementById('pfa').value)||0),end:Date.now()+Math.max(1,Number(document.getElementById('ph').value)||24)*3600000});if(!id)products.push(p);save();closeModal();render();showToast('محصول ذخیره شد')}
function deleteProduct(id){if(confirm('این محصول حذف شود؟')){products=products.filter(p=>p.id!==id);cart=cart.filter(x=>x!==id);delete attempts[id];delete scores[id];save();render();showToast('محصول حذف شد')}}
function resetAttempts(id){attempts[id]=0;scores[id]=0;save();render();showToast('فرصت‌های این محصول برای دمو ریست شد')}
function resetDemo(){if(confirm('همه تغییرات دمو، دسته‌ها و محصولات به حالت اولیه برگردد؟')){['bb_categories','bb_products','bb_user','bb_attempts','bb_scores','bb_cart'].forEach(k=>localStorage.removeItem(k));location.reload()}}
function updateTimers(){document.querySelectorAll('[data-end]').forEach(el=>{const diff=Math.max(0,Number(el.dataset.end)-Date.now());const h=Math.floor(diff/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);el.textContent=diff?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:'پایان یافت'})}
setInterval(()=>{updateTimers();if(!gameRunning&&(page==='home'||page==='competitions'))render()},1000);render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
